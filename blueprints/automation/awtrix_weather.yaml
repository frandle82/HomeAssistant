blueprint:
  name: AWTRIX Weather ⛈️ + Forecast + ☀️
  description: >
    Weather + hourly forecast + sunrise/sunset for AWTRIX 3.
    Moon support fully removed for simplicity, stability and maintainability.
  domain: automation

  input:
    awtrix:
      name: AWTRIX Device
      selector:
        device:
          integration: mqtt
          manufacturer: Blueforcer
          model: AWTRIX 3
          multiple: true

    forecast_var:
      name: Hourly Forecast Entity
      selector:
        entity:
          domain: weather

    hours_to_show:
      name: Forecast Hours
      default: 12
      selector:
        number:
          min: 0
          max: 24
          mode: box

    forecast_temp_field:
      name: Forecast Temperature Attribute
      default: feels_like
      selector:
        text:

    current_temp_var:
      name: Current Temperature Sensor
      selector:
        entity:
          domain: sensor

    temp_digits:
      name: Temperature Decimal Places
      default: 0
      selector:
        number:
          min: 0
          max: 2
          mode: box

    temp_suffix:
      name: Temperature Suffix
      default: "°"
      selector:
        select:
          options:
            - ""
            - "°"
            - "°C"
            - "°F"
            - "C"
            - "F"

    color_matrix_json:
      name: Temperature Color Matrix (JSON)
      selector:
        text:
          multiline: true
      default: >
        {
          "0": "#FEC4FF",
          "10": "#D977DF",
          "20": "#9545BC",
          "30": "#4B379C",
          "40": "#31B8DB",
          "50": "#31DB8B",
          "60": "#6ED228",
          "70": "#FFFF28",
          "80": "#F87E27",
          "90": "#CF3927",
          "100": "#A12527"
        }

    show_sun_rise_set:
      name: Show Sunrise/Sunset
      default: true
      selector:
        boolean:

    sun_event_minute_threshold:
      name: Minutes before Sunrise/Sunset
      default: 30
      selector:
        number:
          min: 5
          max: 1440

    sun_time_type:
      name: Sun Time Display Type
      default: Actual
      selector:
        select:
          options:
            - Relative
            - Actual

    sun_time_format:
      name: Sun Time Format
      default: "%-I%M%p"
      selector:
        text:

    message_duration_forecast:
      name: Forecast Duration (sec)
      default: 30
      selector:
        number:
          min: 0
          max: 300

    message_duration_riseset:
      name: Sunrise/Sunset Duration (sec)
      default: 30
      selector:
        number:
          min: 0
          max: 300

    icon_clear_night: { default: w-clear-night, selector: { text: } }
    icon_cloudy: { default: w-cloudy, selector: { text: } }
    icon_exceptional: { default: w-exceptional, selector: { text: } }
    icon_fog: { default: w-fog, selector: { text: } }
    icon_hail: { default: w-hail, selector: { text: } }
    icon_lightning: { default: w-lightning, selector: { text: } }
    icon_lightning_rainy: { default: w-lightning-rainy, selector: { text: } }
    icon_partlycloudy: { default: w-partlycloudy, selector: { text: } }
    icon_pouring: { default: w-pouring, selector: { text: } }
    icon_rainy: { default: w-rainy, selector: { text: } }
    icon_snowy: { default: w-snowy, selector: { text: } }
    icon_snowy_rainy: { default: w-snowy-rainy, selector: { text: } }
    icon_sunny: { default: w-sunny, selector: { text: } }
    icon_windy: { default: w-windy, selector: { text: } }
    icon_windy_variant: { default: w-windy-variant, selector: { text: } }

mode: restart

variables:
  device_ids: !input awtrix
  app_topic: jeef_weather

  devices_topics: >-
    {%- macro get_device_topic(device_id) -%}
    {{ states((device_entities(device_id) | select('search','device_topic') | list)[0]) }}
    {%- endmacro -%}
    {%- set ns = namespace(devices=[]) -%}
    {%- for device_id in device_ids -%}
      {%- set topic = get_device_topic(device_id)|replace(' ','') -%}
      {%- set ns.devices = ns.devices + [ topic ~ '/custom/' ~ app_topic ] -%}
    {%- endfor -%}
    {{ ns.devices }}

  forecast_var: !input forecast_var
  forecast: "{{ state_attr(forecast_var,'forecast') }}"
  weather: "{{ states(forecast_var) }}"
  hours_to_show: !input hours_to_show

  current_temp_var: !input current_temp_var
  temp_digits: !input temp_digits
  temp_suffix: !input temp_suffix
  current_temp: "{{ states(current_temp_var) | float | round(temp_digits) }}"
  temp_text: "{{ current_temp ~ temp_suffix }}"

  forecast_temp_field: !input forecast_temp_field
  text_available_width: 24

  text_len: >-
    {% set l = temp_text | length %}
    {{ l * 3 + (l - 1) }}

  text_x: "{{ 8 + ((text_available_width - text_len) / 2) }}"

  color_dict: >-
    {% set b = ( !input color_matrix_json ) | from_json %}
    {{ dict(b | dictsort) }}

  icon_dict: >-
    {{ dict({
      'clear-night': !input icon_clear_night,
      'cloudy': !input icon_cloudy,
      'exceptional': !input icon_exceptional,
      'fog': !input icon_fog,
      'hail': !input icon_hail,
      'lightning': !input icon_lightning,
      'lightning-rainy': !input icon_lightning_rainy,
      'partlycloudy': !input icon_partlycloudy,
      'pouring': !input icon_pouring,
      'rainy': !input icon_rainy,
      'snowy': !input icon_snowy,
      'snowy-rainy': !input icon_snowy_rainy,
      'sunny': !input icon_sunny,
      'windy': !input icon_windy,
      'windy-variant': !input icon_windy_variant
    }) }}

  icon: "{{ icon_dict.get(weather, !input icon_cloudy) }}"

  message_duration: !input message_duration_forecast
  message_duration_riseset: !input message_duration_riseset

  payload: >-
    {
      "draw": [
        {"dt":[{{text_x}},1,"{{temp_text}}","#ffffff"]}
      ],
      "icon": "{{icon}}",
      "duration": {{message_duration}},
      "pushIcon": 2,
      "lifetime": 120,
      "weather": "{{weather}}"
    }

trigger:
  - platform: time_pattern
    seconds: /120
  - platform: state
    entity_id: !input forecast_var

action:
  - repeat:
      for_each: "{{ devices_topics }}"
      sequence:
        - service: mqtt.publish
          data:
            topic: "{{ repeat.item }}"
            payload: "{{ payload }}"
