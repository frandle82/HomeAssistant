---
blueprint:
  name: AWTRIX Weather ⛈️ + Forecast
  description: >

    This is somewhat of a mega-weather blueprint.
    Moon support has been removed. All other functionality remains unchanged.



    ![](https://raw.githubusercontent.com/jeeftor/HomeAssistant/master/docs/weather.gif)


    ![](https://raw.githubusercontent.com/jeeftor/HomeAssistant/master/docs/sunset.gif)

    This blueprint will publish to two separate topics.
    `jeef_weather` for the weather report and
    `jeef_weather_sun` if its near sunrise/set

    ## ⚠️ REQUIREMENTS ⚠️

    For this blueprint to work you MUST have a few things pre-setup.

    _This blueprint may be updated as new features_

  domain: automation

  input:
    awtrix:
      name: AWTRIX Device
      description: Select the Awtrix 3
      selector:
        device:
          integration: mqtt
          manufacturer: Blueforcer
          model: AWTRIX 3
          multiple: true

    forecast_var:
      name: Hourly Forecast
      description: >
        Select a sensor that provides an Hourly forecast (not a daily one)
      selector:
        entity:
          domain:
            - weather

    hours_to_show:
      name: Forecast Hours to Show
      selector:
        number:
          max: 24
          min: 0
          unit_of_measurement: "hours"
          mode: box
      default: 12

    forecast_temp_field:
      name: Temperature Attributes
      selector:
        text:
      default: "feels_like"

    temp_digits:
      name: Temp Digits
      selector:
        number:
          min: 0
          max: 2
          step: 1
          mode: box
      default: 0

    temp_suffix:
      name: Temperature suffix
      selector:
        select:
          options:
            - label: None
              value: ""
            - label: "°"
              value: "°"
            - label: °F
              value: "°F"
            - label: °C
              value: "°C"
            - label: F
              value: "F"
            - label: C
              value: "C"
      default: "°"

    current_temp_var:
      name: The current outside temperature
      selector:
        entity:
          domain:
            - sensor

    color_matrix_json:
      name: Color Matrix
      selector:
        text:
          multiline: true
      default: >
        {
          "0": "#FEC4FF",
          "10": "#D977DF",
          "20": "#9545BC",
          "30": "#4B379C",
          "40": "#31B8DB",
          "50": "#31DB8B",
          "60": "#6ED228",
          "70": "#FFFF28",
          "80": "#F87E27",
          "90": "#CF3927",
          "100": "#A12527"
        }

    #----------------------------------------
    # Sunrise Sunset Times :)
    #----------------------------------------
    show_sun_rise_set:
      name: ☀️ Show Sunrise/Sunset
      selector:
        boolean:
      default: True

    sun_event_minute_threshold:
      name: Sun Time Prior 🕰️
      selector:
        number:
          min: 5
          max: 1440
          unit_of_measurement: "min"
      default: 30

    sun_time_type:
      name: Sun Time Type
      selector:
        select:
          options:
            - Relative
            - Actual
      default: "Actual"

    sun_time_format:
      name: Actual Time Format
      selector:
        text:
      default: "%-I%M%p"

    message_duration_forecast:
      name: Forecast Duration ⏱️
      selector:
        number:
          min: 0
          max: 300
      default: 30

    message_duration_riseset:
      name: Sun Rise/Set Duration ⏱️
      selector:
        number:
          min: 0
          max: 300
      default: 30

    #-----------------------------------------
    # Icons
    #-----------------------------------------
    icon_clear_night:
      name: Icon for clear-night
      selector:
        text:
      default: "w-clear-night"

    icon_cloudy: { default: "w-cloudy", selector: { text: } }
    icon_exceptional: { default: "w-exceptional", selector: { text: } }
    icon_fog: { default: "w-fog", selector: { text: } }
    icon_hail: { default: "w-hail", selector: { text: } }
    icon_lightning: { default: "w-lightning", selector: { text: } }
    icon_lightning_rainy: { default: "w-lightning-rainy", selector: { text: } }
    icon_partlycloudy: { default: "w-partlycloudy", selector: { text: } }
    icon_pouring: { default: "w-pouring", selector: { text: } }
    icon_rainy: { default: "w-rainy", selector: { text: } }
    icon_snowy: { default: "w-snowy", selector: { text: } }
    icon_snowy_rainy: { default: "w-snowy-rainy", selector: { text: } }
    icon_sunny: { default: "w-sunny", selector: { text: } }
    icon_windy: { default: "w-windy", selector: { text: } }
    icon_windy_variant: { default: "w-windy-variant", selector: { text: } }

mode: restart

variables:
  device_ids: !input awtrix
  app_topic: jeef_weather

  devices_topics: >-
    {%- macro get_device_topic(device_id) %}
    {{ states((device_entities(device_id) | select('search','device_topic') | list)[0]) }}
    {%- endmacro %}
    {%- set ns = namespace(devices=[]) %}
    {%- for device_id in device_ids %}
      {%- set device = get_device_topic(device_id)|replace(' ','') %}
      {% set ns.devices = ns.devices + [ device ~ '/custom/' ~ app_topic] %}
    {%- endfor %}
    {{ ns.devices | reject('match','unavailable') | list }}

  forecast_var: !input forecast_var
  forecast: "{{ state_attr(forecast_var,'forecast') }}"
  weather: "{{ states(forecast_var) }}"
  hours_to_show: !input hours_to_show

  #----------------
  # Temp & Text
  #----------------
  current_temp_var: !input current_temp_var
  temp_digits: !input temp_digits
  temp_suffix: !input temp_suffix
  current_temp: "{{ states(current_temp_var) | round(temp_digits) }}"
  temp_text: "{{ current_temp ~ temp_suffix }}"
  forecast_temp_field: !input forecast_temp_field

  text_available_width: 24

  text_len: >-
    {%- macro get_text_len(string) %}
    {%- set length = namespace(value=0) %}
    {%- for char in string %}
      {%- if char.isdigit() %}
        {%- set length.value = length.value + 3 %}
      {%- elif char == '°' %}
        {%- set length.value = length.value + 2 %}
      {%- elif char == '.' %}
        {%- set length.value = length.value + 1 %}
      {%- elif char in ['-','C','F'] %}
        {%- set length.value = length.value + 3 %}
      {%- else %}
        {%- set length.value = length.value + 1 %}
      {%- endif %}
      {%- if not loop.last %}
        {%- set length.value = length.value + 1 %}
      {%- endif %}
    {%- endfor %}
    {{ length.value }}
    {%- endmacro %}
    {{ get_text_len(temp_text) }}

  text_x: "{{ 8 + ((text_available_width - text_len)/2) }}"

  message_duration: !input message_duration_forecast
  message_duration_riseset: !input message_duration_riseset

  icon_clear_night: !input icon_clear_night
  icon_cloudy: !input icon_cloudy
  icon_exceptional: !input icon_exceptional
  icon_fog: !input icon_fog
  icon_hail: !input icon_hail
  icon_lightning: !input icon_lightning
  icon_lightning_rainy: !input icon_lightning_rainy
  icon_partlycloudy: !input icon_partlycloudy
  icon_pouring: !input icon_pouring
  icon_rainy: !input icon_rainy
  icon_snowy: !input icon_snowy
  icon_snowy_rainy: !input icon_snowy_rainy
  icon_sunny: !input icon_sunny
  icon_windy: !input icon_windy
  icon_windy_variant: !input icon_windy_variant

  color_matrix_json: !input color_matrix_json
  color_dict: >-
    {% set b = color_matrix_json | from_json %}
    {%- set ns = namespace(tuples=[]) %}
    {%- for k,v in b | items -%}
      {%- set key = k|float -%}
      {%- set ns.tuples = ns.tuples + [(key,v)] %}
    {% endfor %}
    {{ dict.from_keys(ns.tuples) }}

  icon_dict: >-
    {{ dict({
      'clear-night': icon_clear_night,
      'cloudy': icon_cloudy,
      'exceptional': icon_exceptional,
      'fog': icon_fog,
      'hail': icon_hail,
      'lightning': icon_lightning,
      'lightning-rainy': icon_lightning_rainy,
      'partlycloudy': icon_partlycloudy,
      'pouring': icon_pouring,
      'rainy': icon_rainy,
      'snowy': icon_snowy,
      'snowy-rainy': icon_snowy_rainy,
      'sunny': icon_sunny,
      'windy': icon_windy,
      'windy-variant': icon_windy_variant
    }) }}

  icon: "{{ icon_dict[weather] }}"

  payload: >
    {%- macro interpolate(dictionary, x) -%}
      {%- set sorted_keys = dictionary|dictsort -%}
      {%- set above = sorted_keys|selectattr('0', 'gt', x)|map(attribute='0')|list|first -%}
      {%- set below = sorted_keys|selectattr('0', 'lt', x)|map(attribute='0')|list|last -%}
      {%- if below is defined and above is defined -%}
        {{ dictionary[below] }}
      {%- elif below is defined -%}
        {{ dictionary[below] }}
      {%- elif above is defined -%}
        {{ dictionary[above] }}
      {%- else -%}
        "#ffffff"
      {%- endif -%}
    {%- endmacro -%}

    {%- macro draw_forecast_lines(x,hours,height) %}
      {%- for hour in range(hours) %}
        {"dp":[{{x+hour}},7,"{{interpolate(color_dict, forecast[hour][forecast_temp_field]|float)}}"]}{% if not loop.last %},{% endif %}
      {%- endfor %}
    {%- endmacro %}

    {
      "draw": [
        {{ draw_forecast_lines(8,hours_to_show,0) }},
        {"dt":[{{text_x}},1,"{{temp_text}}","{{interpolate(color_dict, current_temp|float)}}"]}
      ],
      "icon": "{{icon}}",
      "duration": {{message_duration}},
      "pushIcon": 2,
      "lifetime": 120,
      "weather": "{{weather}}"
    }

trigger:
  - platform: time_pattern
    seconds: "/5"
  - platform: state
    entity_id: !input forecast_var

condition: []

action:
  - repeat:
      topic: "{{ states(repeat.item) }}/custom/jeef_weather"
      sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: "{{ repeat.item }}"
            payload: >
              {{ payload }}
