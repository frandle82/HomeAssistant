---
blueprint:
  name: AWTRIX Weather ⛈️ + Forecast
  description: >

    This is a mega-weather blueprint for AWTRIX with hourly forecast
    and sunrise / sunset notifications.

    Moon support has been removed to simplify configuration and improve stability.



    ![](https://raw.githubusercontent.com/jeeftor/HomeAssistant/master/docs/weather.gif)


    ![](https://raw.githubusercontent.com/jeeftor/HomeAssistant/master/docs/sunset.gif)

    This blueprint will publish to two separate topics.
    `jeef_weather` for the weather report and
    `jeef_weather_sun` if its near sunrise/set


    ## ⚠️ REQUIREMENTS ⚠️

    - An AWTRIX 3 device
    - An hourly weather forecast provider
    - MQTT integration enabled


    _This blueprint may be updated as new features are added_

    https://raw.githubusercontent.com/jeeftor/HomeAssistant/master/blueprints/automation/awtrix_weatherflow.yaml

  domain: automation

  input:
    awtrix:
      name: AWTRIX Device
      description: Select the Awtrix 3
      selector:
        device:
          integration: mqtt
          manufacturer: Blueforcer
          model: AWTRIX 3
          multiple: true

    forecast_var:
      name: Hourly Forecast
      description: >
        Select a sensor that provides an Hourly forecast (not a daily one)
      selector:
        entity:
          domain:
            - weather

    hours_to_show:
      name: Forecast Hours to Show
      description: >
        How many hours of forecast do you wish to show
        along the bottom of the display
      selector:
        number:
          max: 24
          min: 0
          unit_of_measurement: "hours"
          mode: box
      default: 12

    forecast_temp_field:
      name: Temperature Attributes
      description: >
        Attribute from the hourly forecast that represents temperature
      selector:
        text:
      default: "feels_like"

    temp_digits:
      name: Temp Digits
      description: >
        Decimal precision for temperature display
      selector:
        number:
          min: 0
          max: 2
          step: 1
          mode: box
      default: 0

    temp_suffix:
      name: Temperature suffix
      selector:
        select:
          options:
            - label: None
              value: ""
            - label: "°"
              value: "°"
            - label: °F
              value: "°F"
            - label: °C
              value: "°C"
            - label: F
              value: "F"
            - label: C
              value: "C"
      default: "°"

    current_temp_var:
      name: The current outside temperature
      selector:
        entity:
          domain:
            - sensor

    color_matrix_json:
      name: Color Matrix
      description: >
        Temperature-to-color mapping in JSON format
      selector:
        text:
          multiline: true
      default: >
        {
          "0": "#FEC4FF",
          "10": "#D977DF",
          "20": "#9545BC",
          "30": "#4B379C",
          "40": "#31B8DB",
          "50": "#31DB8B",
          "60": "#6ED228",
          "70": "#FFFF28",
          "80": "#F87E27",
          "90": "#CF3927",
          "100": "#A12527"
        }

    #----------------------------------------
    # Sunrise / Sunset
    #----------------------------------------
    show_sun_rise_set:
      name: ☀️ Show Sunrise/Sunset
      selector:
        boolean:
      default: True

    sun_event_minute_threshold:
      name: Sun Time Prior 🕰️
      selector:
        number:
          min: 5
          max: 1440
          unit_of_measurement: "min"
      default: 30

    sun_time_type:
      name: Sun Time Type
      selector:
        select:
          options:
            - Relative
            - Actual
      default: "Actual"

    sun_time_format:
      name: Actual Time Format
      selector:
        text:
      default: "%-I%M%p"

    message_duration_forecast:
      name: Forecast Duration ⏱️
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: "sec"
      default: 30

    message_duration_riseset:
      name: Sun Rise/Set Duration ⏱️
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: "sec"
      default: 30

    #-----------------------------------------
    # Icons
    #-----------------------------------------
    icon_clear_night:
      name: Icon for clear-night
      selector:
        text:
      default: "w-clear-night"

    icon_cloudy: { default: "w-cloudy", selector: { text: } }
    icon_exceptional: { default: "w-exceptional", selector: { text: } }
    icon_fog: { default: "w-fog", selector: { text: } }
    icon_hail: { default: "w-hail", selector: { text: } }
    icon_lightning: { default: "w-lightning", selector: { text: } }
    icon_lightning_rainy: { default: "w-lightning-rainy", selector: { text: } }
    icon_partlycloudy: { default: "w-partlycloudy", selector: { text: } }
    icon_pouring: { default: "w-pouring", selector: { text: } }
    icon_rainy: { default: "w-rainy", selector: { text: } }
    icon_snowy: { default: "w-snowy", selector: { text: } }
    icon_snowy_rainy: { default: "w-snowy-rainy", selector: { text: } }
    icon_sunny: { default: "w-sunny", selector: { text: } }
    icon_windy: { default: "w-windy", selector: { text: } }
    icon_windy_variant: { default: "w-windy-variant", selector: { text: } }

mode: restart

variables:
  device_ids: !input awtrix
  app_topic: jeef_weather

  devices_topics: >-
    {%- macro get_device_topic(device_id) %}
    {{ states((device_entities(device_id) | select('search','device_topic') | list)[0]) }}
    {%- endmacro %}
    {%- set ns = namespace(devices=[]) %}
    {%- for device_id in device_ids %}
      {%- set device = get_device_topic(device_id)|replace(' ','') %}
      {% set ns.devices = ns.devices + [ device ~ '/custom/' ~ app_topic] %}
    {%- endfor %}
    {{ ns.devices }}

  forecast_var: !input forecast_var
  forecast: "{{state_attr(forecast_var,'forecast')}}"
  weather: "{{states(forecast_var)}}"
  hours_to_show: !input hours_to_show

  current_temp_var: !input current_temp_var
  temp_digits: !input temp_digits
  temp_suffix: !input temp_suffix
  current_temp: "{{states(current_temp_var) | round(temp_digits)}}"
  temp_text: "{{ current_temp ~ temp_suffix}}"

  forecast_temp_field: !input forecast_temp_field
  text_available_width: 24

  text_len: "{{ temp_text | length * 3 }}"
  text_x: "{{ 8 + ((text_available_width - text_len)/2) }}"

  color_dict: >-
    {% set b = color_matrix_json | from_json %}
    {{ dict(b | dictsort) }}

  icon_dict: >-
    {{ dict({
      'clear-night': icon_clear_night,
      'cloudy': icon_cloudy,
      'exceptional': icon_exceptional,
      'fog': icon_fog,
      'hail': icon_hail,
      'lightning': icon_lightning,
      'lightning-rainy': icon_lightning_rainy,
      'partlycloudy': icon_partlycloudy,
      'pouring': icon_pouring,
      'rainy': icon_rainy,
      'snowy': icon_snowy,
      'snowy-rainy': icon_snowy_rainy,
      'sunny': icon_sunny,
      'windy': icon_windy,
      'windy-variant': icon_windy_variant
    }) }}

  icon: "{{ icon_dict[weather] }}"

  message_duration: !input message_duration_forecast
  message_duration_riseset: !input message_duration_riseset

  payload: >
    {
      "draw": [
        {"dt":[{{text_x}},1,"{{temp_text}}","#ffffff"]}
      ],
      "icon": "{{icon}}",
      "duration": {{message_duration}},
      "pushIcon": 2,
      "lifetime": 120,
      "weather": "{{weather}}"
    }

trigger:
  - platform: time_pattern
    seconds: /120
  - platform: state
    entity_id: !input forecast_var

condition: []

action:
  - repeat:
      for_each: "{{ devices_topics }}"
      sequence:
        - service: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: "{{ repeat.item }}"
            payload: "{{ payload }}"
